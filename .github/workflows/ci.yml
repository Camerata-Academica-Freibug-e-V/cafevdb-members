# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Basic checks via the shared CI workflow of the build system: eslint,
# php -l, realclean check and a full build of the unsigned app archive.
# The server-based PHPUnit suites live in phpunit.yml.
name: CI

on:
  push:
    branches: [ master, main, stable35, 'cjh-*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  ci:
    uses: rotdrop/nextcloud-app-build-system/.github/workflows/ci.yml@v1
    with:
      php-version: '8.5'
      php-versions: '["8.5"]'
      php-lint-dirs: lib appinfo templates
      build-server: true
      signing-server-ref: stable35
      composer-use-github-api: false
      verify-script: .github/scripts/verify-build.sh
