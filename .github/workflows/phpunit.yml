name: PHPUnit

on:
  push:
    branches: [ master, main, stable35, 'cjh-*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NC_REPO: Camerata-Academica-Freibug-e-V/nextcloud-server
  NC_BRANCH: cjh-stable35
  APP_NAME: cafevdbmembers

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql, pgsql]
    services:
      mariadb:
        image: ${{ matrix.database == 'mysql' && 'mariadb:11.4' || '' }}
        env:
          MARIADB_DATABASE: nextcloud
          MARIADB_USER: nextcloud
          MARIADB_PASSWORD: nextcloud
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 13306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_DB: nextcloud
          POSTGRES_USER: nextcloud
          POSTGRES_PASSWORD: nextcloud
        ports:
          - 15432:5432
        options: >-
          --health-cmd="pg_isready -U nextcloud -d nextcloud"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      PHP_VERSION: '8.5'
      MARIADB_MAJOR: '12'
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
    steps:
      - name: Checkout modified Nextcloud server
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NC_REPO }}
          ref: ${{ env.NC_BRANCH }}
          submodules: recursive
          path: server

      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: server/apps/${{ env.APP_NAME }}
          submodules: recursive

      - name: Install xpath
        # the Makefile needs the xpath binary to read the app info from info.xml
        run: sudo apt-get install -y --no-install-recommends libxml-xpath-perl

      - name: Install latest MariaDB ${{ env.MARIADB_MAJOR }}.x server and client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates apt-transport-https
          sudo install -d /etc/apt/keyrings
          sudo curl -fsSL https://mariadb.org/mariadb_release_signing_key.pgp \
            | sudo gpg --dearmor --yes --output /etc/apt/keyrings/mariadb-keyring.gpg
          # newest series (e.g. 12.2) of the pinned major version, stable or RC
          MARIADB_VERSION="$(curl -fsSL https://downloads.mariadb.org/rest-api/mariadb/ \
            | jq -r --arg m "${MARIADB_MAJOR}." \
              '[.major_releases[] | select(.release_id | startswith($m)) | select(.release_status | IN("Stable","RC"))][0].release_id')"
          [ -n "$MARIADB_VERSION" ] && [ "$MARIADB_VERSION" != null ] || { echo "no MariaDB ${MARIADB_MAJOR}.x series found"; exit 1; }
          echo "Using MariaDB series ${MARIADB_VERSION}"
          codename="$(lsb_release -cs)"
          echo "deb [signed-by=/etc/apt/keyrings/mariadb-keyring.gpg] https://archive.mariadb.org/mariadb-${MARIADB_VERSION}/repo/ubuntu ${codename} main" \
            | sudo tee /etc/apt/sources.list.d/mariadb.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mariadb-server mariadb-client
          # PHPUnit starts its own private server; type generation needs no MariaDB.
          sudo systemctl stop mariadb
          for b in mariadb-install-db mariadbd-safe mariadb mariadb-dump; do
            command -v "$b" || { echo "missing $b"; exit 1; }
          done
          mariadb --version

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, curl, dom, gd, iconv, intl, json, mbstring, openssl, pdo_mysql, pdo_pgsql, pdo_sqlite, posix, sqlite3, xml, zip, apcu, bcmath, gmp, imagick, fileinfo
          coverage: xdebug
          tools: composer:v2
          ini-values: apc.enable_cli=1, memory_limit=1G

      - name: Install Nextcloud (${{ matrix.database }})
        working-directory: server
        env:
          DATABASE: ${{ matrix.database }}
          # The service containers already provision the database and user.
          NC_setup_create_db_user: 'false'
        run: |
          composer install --no-interaction --no-progress
          db_args=(--database="$DATABASE")
          if [ "$DATABASE" != sqlite ]; then
            port=13306
            if [ "$DATABASE" = pgsql ]; then port=15432; fi
            db_args+=(--database-host=127.0.0.1 --database-port="$port"
              --database-name=nextcloud --database-user=nextcloud --database-pass=nextcloud)
          fi
          php occ maintenance:install "${db_args[@]}" --admin-user=admin --admin-pass=admin --no-interaction
          php occ config:system:set debug --value=true --type=boolean

      - name: Install app PHP dependencies
        working-directory: server/apps/${{ env.APP_NAME }}
        run: |
          make composer

      - name: Enable app
        working-directory: server
        run: php occ app:enable ${{ env.APP_NAME }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/apps/${{ env.APP_NAME }}/package-lock.json

      - name: Install app JavaScript dependencies
        working-directory: server/apps/${{ env.APP_NAME }}
        run: |
          npm ci
          # Keep locked versions instead of letting make invoke npm update.
          touch package-lock.json

      - name: Build frontend assets
        working-directory: server/apps/${{ env.APP_NAME }}
        run: make build

      - name: Run PHPUnit server suite with coverage
        working-directory: server/apps/${{ env.APP_NAME }}
        run: make phpunit PHPUNIT_CONFIG=phpunit.server.xml PHPCOVERAGE='-d xdebug.mode=coverage'

      - name: Upload PHPUnit coverage report
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-coverage-${{ matrix.database }}
          path: server/apps/${{ env.APP_NAME }}/build/artifacts/tests/phpunit/code-coverage/
          if-no-files-found: error
