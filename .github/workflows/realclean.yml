name: Make realclean

on:
  pull_request:
  push:
    branches:
      - master
      - stable*

permissions:
  contents: read

env:
  NC_REPO: rotdrop/nextcloud-server
  NC_BRANCH: cjh-stable35
  APP_NAME: cafevdbmembers

jobs:
  realclean:
    runs-on: ubuntu-latest
    name: make realclean
    env:
      PHP_VERSION: '8.5'
      MARIADB_MAJOR: '12'
    steps:
      - name: Use https for submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout Nextcloud
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NC_REPO }}
          ref: ${{ env.NC_BRANCH }}
          submodules: recursive
          path: server

      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: server/apps/${{ env.APP_NAME }}
          submodules: recursive

      - name: Install xpath
        run: sudo apt-get install -y --no-install-recommends libxml-xpath-perl

      - name: Install latest MariaDB ${{ env.MARIADB_MAJOR }}.x server and client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates apt-transport-https
          sudo install -d /etc/apt/keyrings
          sudo curl -fsSL https://mariadb.org/mariadb_release_signing_key.pgp \
            | sudo gpg --dearmor --yes --output /etc/apt/keyrings/mariadb-keyring.gpg
          MARIADB_VERSION="$(curl -fsSL https://downloads.mariadb.org/rest-api/mariadb/ \
            | jq -r --arg m "${MARIADB_MAJOR}." \
              '[.major_releases[] | select(.release_id | startswith($m)) | select(.release_status | IN("Stable","RC"))][0].release_id')"
          [ -n "$MARIADB_VERSION" ] && [ "$MARIADB_VERSION" != null ] || { echo "no MariaDB ${MARIADB_MAJOR}.x series found"; exit 1; }
          echo "Using MariaDB series ${MARIADB_VERSION}"
          codename="$(lsb_release -cs)"
          echo "deb [signed-by=/etc/apt/keyrings/mariadb-keyring.gpg] https://archive.mariadb.org/mariadb-${MARIADB_VERSION}/repo/ubuntu ${codename} main" \
            | sudo tee /etc/apt/sources.list.d/mariadb.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mariadb-server mariadb-client
          sudo systemctl enable --now mariadb
          mariadb --version

      - name: Realclean on bare checkout
        working-directory: server/apps/${{ env.APP_NAME }}
        run: make realclean

      - name: Realclean on bare checkout is idempotent
        working-directory: server/apps/${{ env.APP_NAME }}
        run: |
          make realclean
          [ -z "$(git status --porcelain --ignored)" ] || { git status --porcelain --ignored; exit 1; }

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, curl, dom, gd, iconv, intl, json, mbstring, openssl, pdo_sqlite, posix, sqlite3, xml, zip, apcu, bcmath, gmp, imagick, fileinfo
          tools: composer:v2
          ini-values: apc.enable_cli=1, memory_limit=1G

      - name: Install Nextcloud
        working-directory: server
        run: |
          composer install --no-interaction --no-progress
          php occ maintenance:install --database=sqlite \
            --admin-user=admin --admin-pass=admin --no-interaction
          php occ config:system:set debug --value=true --type=boolean

      - name: Install app PHP dependencies
        working-directory: server/apps/${{ env.APP_NAME }}
        run: make dev-setup-php

      - name: Enable app
        working-directory: server
        run: php occ app:enable ${{ env.APP_NAME }}

      - name: Configure app database and apply migrations
        working-directory: server
        run: |
          db_password="$(openssl rand -hex 24)"
          app_user="cafevdb-ci"
          app_group="cafevdb_ci"
          user_password="$(openssl rand -hex 24)"
          sudo mariadb <<SQL
          CREATE DATABASE cafevdb CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER 'cafevdb'@'%' IDENTIFIED BY '${db_password}';
          GRANT ALL PRIVILEGES ON cafevdb.* TO 'cafevdb'@'%';
          SQL
          php occ group:add "${app_group}"
          OC_PASS="${user_password}" php occ user:add --password-from-env "${app_user}"
          php occ group:adduser "${app_group}" "${app_user}"
          php occ config:app:set "${APP_NAME}" dbname --value=cafevdb
          php occ config:app:set "${APP_NAME}" dbuser --value=cafevdb
          php occ config:app:set "${APP_NAME}" dbpassword --value="${db_password}"
          php occ config:app:set "${APP_NAME}" dbserver --value=127.0.0.1
          php occ config:app:set "${APP_NAME}" userGroup --value="${app_group}"
          password_file="apps/${APP_NAME}/.clipassword"
          printf %s "${user_password}" > "$password_file"
          chmod 600 "$password_file"
          php occ "${APP_NAME}:database:migrate" -v \
            --user="${app_user}" --password-file="${password_file}"

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Full build
        working-directory: server/apps/${{ env.APP_NAME }}
        run: CAFEVDB_USER=cafevdb-ci make dev-setup npm-build

      - name: Remove temporary credentials and caches
        if: always()
        working-directory: server/apps/${{ env.APP_NAME }}
        run: rm -f .clipassword .phpunit.result.cache .phpunit.cache

      - name: Realclean after full build
        working-directory: server/apps/${{ env.APP_NAME }}
        run: |
          make realclean
          [ -z "$(git status --porcelain --ignored)" ] || { git status --porcelain --ignored; exit 1; }

      - name: Realclean after full build is idempotent
        working-directory: server/apps/${{ env.APP_NAME }}
        run: |
          make realclean
          [ -z "$(git status --porcelain --ignored)" ] || { git status --porcelain --ignored; exit 1; }

      - name: Show changes on failure
        if: failure()
        working-directory: server/apps/${{ env.APP_NAME }}
        run: |
          git status --ignored
          git --no-pager diff
